services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis

    restart: unless-stopped

    volumes:
      - ./backend:/app

  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    env_file:
      - ./backend/.env
    volumes:
      - pg_data:/var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped

  celery-worker:
    build: ./backend
    command: celery -A api worker -l info
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A api beat -l info
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./backend:/app


volumes:
    pg_data:
